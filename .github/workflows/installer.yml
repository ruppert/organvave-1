# SPDX-License-Identifier: GPL-3.0-only
# OrganVave-1's site on GitHub Pages, at https://ruppert.github.io/organvave-1/ (Settings > Pages: Source = GitHub Actions).
name: Installer

# Until 0.5.0 it publishes only the placeholder page (web/placeholder.html with the splash): no firmware build, no package.
# From 0.5.0: the installer job below (restore its steps and its paths: firmware/**, tools/**, assets/**, build.sh, docs/emu/**).
on:
  push:
    branches: [main]
    paths: ["web/placeholder.html", "docs/organvave-splash.png", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The placeholder page
        run: |
          pip install Pillow
          mkdir -p _site
          cp web/placeholder.html _site/index.html
          python3 -c "from PIL import Image; Image.open('docs/organvave-splash.png').convert('RGB').resize((900, 900), Image.LANCZOS).save('_site/splash.webp', quality=86)"
          echo "OrganVave-1 placeholder page" >> "$GITHUB_STEP_SUMMARY"

      # 0.5.0 (the installer, the editor, the emulator): Python packages (Pillow fonttools); the JieLi toolchain
      # (tools/get_toolchain.sh) and the AC79 SDK (git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13
      # https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"); ./build.sh; then
      #   VERSION=$(sed -n 's/^#define ORGANVAVE_VERSION "v\(.*\)"/\1/p' firmware/src/core.h)
      #   python3 web/make_fmug_installer.py build/felucca.fwsc _site/index.html "$VERSION"
      #   cp build/felucca.fwsc "_site/organvave-1-$VERSION.fwsc"
      #   mkdir -p _site/editor && cp web/editor_fmini.html _site/editor/index.html
      #   cp -r docs/emu _site/emu

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
